# Конфигурация плагина Passport
passport:
  # Срок действия в днях
  expiry-days: 30
  # Лимит возраста (минимум-максимум через дефис)
  age-limit: "1-99"
  # Разрешить английские буквы в имени (false - только русские)
  allow-english-name: false
  # Город по умолчанию
  default-city: "Пин-сити"
  # Допустимые варианты пола (через пробел)
  gender-options: "Мужской Женский"
  # Допустимые варианты семейного положения (через пробел)
  married-options: "Да Нет"
  # Интервал уведомлений о просрочке в секундах
  notify-interval: 360

# Часовой пояс (МСК)
timezone: "Europe/Moscow"