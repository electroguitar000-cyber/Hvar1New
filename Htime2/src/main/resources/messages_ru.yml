  point-deleted-all: "&#AAFFAABᴄᴇ тᴏчᴋи удᴀлᴇʜы!"
  point-deleted: "&#FFAA55тᴏчᴋᴀ {number} ʏдᴀлᴇʜᴀ!"
  point-not-exist: "&#FF5555Tᴏчᴋи {number} ʜᴇ ᴄущᴇᴄтʙʏᴇт!"
