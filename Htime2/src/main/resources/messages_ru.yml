  pos-deleted: "&#FFAA55Tᴏчᴋи Pᴏs1 и Pᴏs2 удᴀлᴇʜы!"

# Матч
match:
  started: "&#55FF55Пᴇᴘиᴏд {period} ʜᴀчᴀлᴄя! &#AAFFAA{minutes}"
  force-ended: "&#FFAA55Мᴀтч дᴏᴄᴘᴏчʜᴏ зᴀʙᴇᴘшёʜ!"
  not-started: "&#FF5555Мᴀтч ʜᴇ зᴀпущᴇʜ!"
  paused: "&#FFAA55Bᴘᴇмя мᴀтчᴀ пᴘиᴏᴄтᴀʜᴏʙлᴇʜᴏ!"
  resumed: "&#55FF55Bᴘᴇмя мᴀтчᴀ ʙᴏзᴏбʜᴏʙлᴇʜᴏ!"
  natural-end: "&#FF0000&lДO BЫБPOCA!!!"

# Перерыв
break:
  started: "&#55AAFFПᴇᴘᴇᴘыʙ ʜᴀ {seconds}c ʜᴀчᴀлᴄя!"
  ended: "&#AAFFAAПᴇᴘᴇᴘыʙ зᴀᴋᴏʜчилᴄя!"
  force-ended: "&#FFAA55Пᴇᴘᴇᴘыʙ был зᴀᴋᴏʜчᴇʜ дᴏᴄᴘᴏчʜᴏ!"
  not-running: "&#FF5555Пᴇᴘᴇᴘыʙ ʜᴇ зᴀпущᴇʜ!"

# Штрафы
penalty:
  added: "&#FF5555{player} пᴏᴄᴀжᴇʜ зᴀ {reason} ʜᴀ {minutes}м"
  removed: "&#AAFFAA{player} ʙышᴇл дᴏᴄᴘᴏчʜᴏ!"
  not-found: "&#FF5555У игᴘᴏᴋᴀ {player} ʜᴇт штᴘᴀȹᴀ!"
  expired: "&#AAFFAA{player} ᴏтбыл штᴘᴀȹ!"
  player-not-found: "&#FF5555Игᴘᴏᴋ {player} ʜиᴋᴏгдᴀ ʜᴇ зᴀxᴏдил ʜᴀ ᴄᴇᴘʙᴇᴘ!"

  # История
  history:
    header: "&#FFAA55-- Иᴄтᴏᴘия штᴘᴀфᴏʙ (пᴏᴄлᴇдʜиᴇ 10) --"
    empty: "&#AAAAAAИᴄтᴏᴘия штᴘᴀфᴏʙ пуᴄтᴀ."
    entry: "&#FFAA55&l{player} &f&l{reason} &7&l{time} &8&l{date}"

  # Буллит
  bullit:
    activated: "&7BULLITMODE - on (пизда вратарю...)"
    description: "&8BULLITMODE - on"

  # период
  per:
    activated: "PERMODE - on"
    description: "PERMODE - on (время будет идти как обычно"

# Лодки
