prefix: "&8[&bHvar1&8] "

# ─── Команда /Hvar1 help ────────────────────────────────────
help-header: "&7&m----&r &bHvar{arena} &7Команды &7&m----"
help-footer: "&7&m--------------------------------"
help-lines:
  - "&b/hvar{arena} help &7— показать это меню"
  - ""
  - "&e— Ворота —"
  - "&b/hvar{arena} l pos1 &7— установить точку 1 левых ворот"
  - "&b/hvar{arena} l pos2 &7— установить точку 2 левых ворот"
  - "&b/hvar{arena} r pos1 &7— установить точку 1 правых ворот"
  - "&b/hvar{arena} r pos2 &7— установить точку 2 правых ворот"
  - "&b/hvar{arena} L/R del &7— удалить все точки, игроков и статистику для стороны"
  - "&b/hvar{arena} on &7— включить ворота (активировать детект)"
  - "&b/hvar{arena} off &7— выключить ворота (деактивировать детект)"
  - "&b/hvar{arena} status &7— статус ворот"
  - ""
  - "&e— Створы (штанги) —"
  - "&b/hvar{arena} L stvor1 pos1 &7— установить створ №1 для левых ворот"
  - "&b/hvar{arena} L stvor2 pos1 &7— установить створ №2 для левых ворот"
  - "&b/hvar{arena} R stvor1 pos1 &7— установить створ №1 для правых ворот"
  - "&b/hvar{arena} R stvor2 pos1 &7— установить створ №2 для правых ворот"
  - ""
  - "&e— Сейвы —"
  - "&b/hvar{arena} L save pos1 &7— установить зону сейва №1 для левых ворот"
  - "&b/hvar{arena} L save pos2 &7— установить зону сейва №2 для левых ворот"
  - "&b/hvar{arena} R save pos1 &7— установить зону сейва №1 для правых ворот"
  - "&b/hvar{arena} R save pos2 &7— установить зону сейва №2 для правых ворот"
  - ""
  - "&e— Плейсхолдер —"
  - "&b/hvar{arena} placeholder place &7— установить текстовый дисплей со статистикой"
  - "&b/hvar{arena} placeholder delete &7— удалить плейсхолдер"
  - ""
  - "&e— Статистика (stata) —"
  - "&b/hvar{arena} stata list &7— показать статистику арены"
  - "&b/hvar{arena} stata add L/R игрок1 игрок2... &7— добавить игроков в команду"
  - "&b/hvar{arena} stata del L/R ник &7— удалить игрока из команды"
  - "&b/hvar{arena} stata canel &7— отменить последний гол"
  - "&b/hvar{arena} stata +gol ник &7— добавить гол игроку"
  - "&b/hvar{arena} stata -gol ник &7— убрать гол у игрока"
  - "&b/hvar{arena} stata +pas ник &7— добавить пас игроку"
  - "&b/hvar{arena} stata -pas ник &7— убрать пас у игрока"
  - "&b/hvar{arena} stata L Название &7— задать название левой команде"
  - "&b/hvar{arena} stata R Название &7— задать название правой команде"
  - ""
  - "&e— Общие —"
  - "&b/hvar{arena} reload &7— перезагрузить плагин"
  - ""

